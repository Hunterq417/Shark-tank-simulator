databases:
  - name: sharktank-db
    databaseName: sharktank
    user: sharktank
    plan: free

services:
  - type: web
    name: sharktank-simulator-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: sharktank-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1d
      - key: REFRESH_SECRET
        generateValue: true
      - key: REFRESH_EXPIRES_IN
        value: 7d
      # Tighten this to your Vercel frontend's origin after that deploy is live,
      # e.g. https://sharktank-simulator.vercel.app
      - key: CORS_ORIGIN
        value: "*"
